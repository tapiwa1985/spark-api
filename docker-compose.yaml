services:
  app:
    build: .
    container_name: api
    ports:
      - "8080:8000"
    volumes:
      - .:/app
    working_dir: /app
    # Do not cache config in local Docker: a shared volume + config:cache ignores per-service
    # env (e.g. Reverb’s CACHE_STORE=file), so Reverb kept using the DB cache driver and failed.
    command: bash -c 'php artisan config:clear && php artisan serve --host 0.0.0.0'
    depends_on:
      - postgres
    links:
      - postgres
    extra_hosts:
      - "mailhog_server:host-gateway"
    environment:
      - DB_HOST_MAIN=postgres
      - DB_HOST_TEST=postgres-test
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Inside this container, localhost is NOT the Reverb server. Use the compose service name.
      - REVERB_HOST=reverb
      - REVERB_PORT=8081
      - REVERB_SCHEME=http
    networks:
      - laravel-network

  reverb:
    build: .
    container_name: reverb
    ports:
      - "8081:8081"
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c 'php artisan config:clear && php artisan reverb:start --host=0.0.0.0 --port=8081'
    restart: unless-stopped
    depends_on:
      - postgres
      - app
    environment:
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - laravel-network

  postgres:
    image: postgis/postgis:16-3.4 
    container_name: postgres
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    ports:
      - "5432:5432"
    networks:
      - laravel-network
    restart: unless-stopped

  mailhog_server:
    image: mailhog/mailhog
    container_name: mailhog_server
    tty: true
    ports:
      - '1025:1025'
      - '8025:8025'
    restart: on-failure
    networks:
      - laravel-network

  pgadmin:
    image: dpage/pgadmin4:6.15
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@linuxhint.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_LISTEN_PORT: 83
    ports:
      - "8000:83"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - laravel-network

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - laravel-network

volumes:
  postgres-data:  
    driver: local
  pgadmin-data:
  redis-data:

networks:
  laravel-network:
    driver: bridge