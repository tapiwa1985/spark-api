name: Laravel CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4 
        env:
          POSTGRES_USER: laravel_test_user
          POSTGRES_PASSWORD: laravel_test_password
          POSTGRES_DB: laravel_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine  
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laravel_test
      DB_USERNAME: laravel_test_user
      DB_PASSWORD: laravel_test_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      APP_ENV: testing
      APP_DEBUG: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, bcmath, redis, gd, zip
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          # Create fresh .env file for testing
          cat > .env << 'EOF'
          APP_NAME="Laravel Test"
          APP_ENV=testing
          APP_DEBUG=false
          APP_TIMEZONE=UTC
          APP_URL=http://localhost

          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=laravel_test
          DB_USERNAME=laravel_test_user
          DB_PASSWORD=laravel_test_password

          # Cache configuration for testing - use array to avoid Redis issues
          # BUT set Redis config for code that requires it
          SESSION_DRIVER=array  # Use array for tests
          CACHE_DRIVER=array    # Use array for tests
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          FILESYSTEM_DISK=testing

          # Redis configuration (for code that needs it)
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          REDIS_CLIENT=predis    # ✅ Use predis for CI

          AUTH_GUARD=api

          JWT_SECRET=
          APP_KEY=
          EOF

          # Generate fresh keys
          php artisan key:generate --force

          # Generate JWT secret key
          # php artisan jwt:secret --force

          # Verify .env
          echo "=== Generated .env ==="
          grep -E "^(APP_KEY|JWT_SECRET|DB_|REDIS_|APP_ENV)=" .env
          echo "======================"

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U laravel_test_user -d postgres 2>/dev/null; then
              echo "✅ PostgreSQL ready"
              break
            fi
            echo "⏳ Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null | grep -q PONG; then
              echo "✅ Redis ready"
              break
            fi
            echo "⏳ Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Setup database
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: laravel_test_user
          PGPASSWORD: laravel_test_password
          PGDATABASE: postgres
        run: |
          psql -c "DROP DATABASE IF EXISTS laravel_test;"
          psql -c "CREATE DATABASE laravel_test;"
          psql -c "GRANT ALL PRIVILEGES ON DATABASE laravel_test TO laravel_test_user;"

      - name: Run migrations
        run: php artisan migrate --force

      - name: Set directory permissions
        run: |
          mkdir -p storage/framework/{sessions,views,cache}
          chmod -R 775 storage bootstrap/cache

      - name: Run tests 
        run: |
            php artisan test

      - name: Run Static Analysis (PHPStan)
        if: success()
        run: php -d memory_limit=2G ./vendor/bin/phpstan analyse app tests --no-progress

      - name: PHP Code Style (phpcs)
        uses: chindit/actions-phpcs@master
        with:
          cli: "--standard=PSR12"
          dir: app/

      - name: Check Security Vulnerabilities
        if: success()
        run: composer audit